<!-- Palco 3D (canvas em tela cheia, atrás de tudo) -->
<app-stage />

<app-header
  nome="Pedro Henrique dos Santos"
  [links]="links"
  [active]="journey.nearestIndex()"
  (selected)="journey.goTo($event)"
/>

<!-- Conteúdo de cada sala: fica fixo na tela e só aparece enquanto a câmera está naquela sala -->
<main>
  @for (room of journey.rooms; track room.id; let i = $index) {
  <section
    class="pointer-events-none fixed inset-0 z-10 translate-y-6 opacity-0 transition-[opacity,translate] duration-700 ease-out data-[active=true]:pointer-events-auto data-[active=true]:translate-y-0 data-[active=true]:opacity-100 motion-reduce:transition-none"
    [attr.data-active]="journey.activeIndex() === i"
    [attr.aria-hidden]="journey.activeIndex() !== i"
  >
    @if (room.id === 'home') {
    <app-home />
    } @else {
    <app-room-panel [compartment]="room.compartment" [title]="room.label" [index]="i" />
    }
  </section>
  }
</main>

<!-- Espaço rolável: é o scroll dentro dele que conduz a câmera pela estação -->
<div [style.height.vh]="journey.scrollScreens * 100" aria-hidden="true"></div>
