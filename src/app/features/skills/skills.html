<div class="mx-auto h-full max-w-6xl overflow-y-auto px-6 pt-24 pb-16">
  <div class="max-w-md rounded-sm border-l border-signal/50 bg-space/55 py-4 pr-6 pl-6 backdrop-blur-[2px]">
    <p class="font-mono text-xs tracking-[0.3em] text-signal uppercase">
      <span class="text-ember">04</span> · Engine room
    </p>
    <h2 class="mt-2 text-4xl leading-none font-bold tracking-tight md:text-6xl">Skills</h2>
  </div>

  <div class="mt-10 grid gap-5 md:grid-cols-2">
    @for (category of categories; track category.name) {
    <section class="rounded-sm border border-line/60 bg-hull/40 p-5 backdrop-blur-[2px]">
      <h3 class="font-mono text-xs tracking-[0.25em] text-signal uppercase">{{ category.name }}</h3>
      <ul class="mt-3 flex flex-wrap gap-2">
        @for (skill of category.skills; track skill) {
        <li class="rounded-full border border-line/60 bg-space/60 px-3 py-1 font-mono text-[11px] text-dim">
          {{ skill }}
        </li>
        }
      </ul>
    </section>
    }
  </div>
</div>
