<div class="scroll-dock mx-auto h-full max-w-6xl overflow-y-auto px-6 pt-24 pb-16">
  <div class="max-w-md rounded-sm border-l border-signal/50 bg-space/90 py-4 pr-6 pl-6 backdrop-blur-md">
    <p class="font-mono text-xs tracking-[0.3em] text-signal uppercase">
      <span class="text-ember">04</span> · Engine room
    </p>
    <h2 class="mt-2 text-4xl leading-none font-bold tracking-tight md:text-6xl">Skills</h2>
  </div>

  <div class="mt-10 grid gap-5 md:grid-cols-2">
    @for (category of categories; track category.name; let i = $index) {
    <section
      class="animate-card-in min-w-0 rounded-sm border border-line/60 bg-hull/85 p-5 backdrop-blur-md transition-[transform,border-color,box-shadow] duration-300 hover:-translate-y-1 hover:border-signal/50 hover:shadow-[0_0_40px_-16px_var(--color-signal)] motion-reduce:animate-none"
      [style.animation-delay.ms]="i * 60"
    >
      <h3 class="font-mono text-xs tracking-[0.25em] text-signal uppercase">{{ category.name }}</h3>
      <ul
        class="scroll-dock mt-3 flex gap-2 overflow-x-auto pb-2 [mask-image:linear-gradient(to_right,black_92%,transparent)]"
      >
        @for (skill of category.skills; track skill) {
        <li
          class="flex shrink-0 items-center gap-1.5 rounded-full border border-line/60 bg-space/80 py-1 pr-3 pl-1.5 font-mono text-[11px] text-dim transition-transform duration-200 hover:-translate-y-0.5 hover:border-signal/50 hover:text-star"
        >
          @if (icon(skill); as src) {
          <img [src]="src" [alt]="skill" width="18" height="18" loading="lazy" class="size-[18px] shrink-0" />
          } @else {
          <span
            class="flex size-[18px] shrink-0 items-center justify-center rounded-full bg-signal/10 text-[8px] font-bold text-signal"
          >
            {{ initials(skill) }}
          </span>
          }
          {{ skill }}
        </li>
        }
      </ul>
    </section>
    }
  </div>
</div>
