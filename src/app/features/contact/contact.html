<div class="mx-auto flex h-full max-w-6xl items-center px-6 pt-20">
  <div class="flex max-w-xl flex-col gap-6 rounded-sm border-l border-signal/50 bg-space/90 py-4 pr-6 pl-6 backdrop-blur-md">
    <p class="font-mono text-xs tracking-[0.3em] text-signal uppercase">
      <span class="text-ember">07</span> · Cockpit
    </p>
    <h2 class="text-4xl leading-none font-bold tracking-tight md:text-6xl">Contact</h2>
    <p class="max-w-md text-sm leading-relaxed text-dim">
      Open channel — reach out by email or find me on these platforms.
    </p>

    <ul class="flex flex-col gap-3 font-mono text-sm">
      <li>
        <a
          [href]="'mailto:' + email"
          class="inline-flex items-center gap-2 text-star transition-colors hover:text-signal"
        >
          <span class="text-ember" aria-hidden="true">✉</span> {{ email }}
        </a>
      </li>
      <li>
        <a
          href="https://github.com/pedrohenriquedsdev"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-star transition-colors hover:text-signal"
        >
          <span class="text-ember" aria-hidden="true">↗</span> GitHub
        </a>
      </li>
      <li>
        <a
          href="https://www.linkedin.com/in/pedrohenriqueds-dev"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-star transition-colors hover:text-signal"
        >
          <span class="text-ember" aria-hidden="true">↗</span> LinkedIn
        </a>
      </li>
      <li>
        <a
          href="https://www.instagram.com/pedrohenrique.tech"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-star transition-colors hover:text-signal"
        >
          <span class="text-ember" aria-hidden="true">↗</span> Instagram
        </a>
      </li>
    </ul>
  </div>
</div>
